<script>
  /* Per-character ink, applied once. The rules are the same as the portfolio's: a gradient across a
     block is a brightness falloff, so every glyph gets its own ramp. */
  (function () {
    const targets = document.querySelectorAll("h1, #status, .note, .kicker, footer a");
    for (const el of targets) {
      const frag = document.createDocumentFragment();
      for (const part of el.textContent.split(/(\s+)/)) {
        if (!part) continue;
        if (/^\s+$/.test(part)) {
          frag.appendChild(document.createTextNode(part));
          continue;
        }
        const word = document.createElement("span");
        word.className = "ink-word";
        for (const ch of Array.from(part)) {
          const s = document.createElement("span");
          s.className = "ink";
          s.textContent = ch;
          word.appendChild(s);
        }
        frag.appendChild(word);
      }
      el.replaceChildren(frag);
    }
  })();
</script>
