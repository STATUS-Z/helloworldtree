<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World Tree — a vessel, not yet filled</title>
<meta name="description" content="Artifact in, proof out. A substrate that renders what a system is rather than what it claims.">
<meta name="theme-color" content="#030208">
<style>
  :root {
    --void: #030208;
    --diox-a: #0b0414;
    --diox-b: #1a0a28;
    --hum: #e5007e;
    --hum-hot: #ff2d9b;
    --plum: #7a2350;
    --indigo: #2e3bff;
    --gold: #ffd400;
    --white: #ffffff;
    --type-grad: linear-gradient(180deg, #ffd400 0%, #ffffff 100%);
    --mono: "MedievalSharp", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    color: var(--white);
    font-family: var(--mono);
    overflow: hidden;
  }

  #vessel {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* ── the type ────────────────────────────────────────────────
     Per-character gradient, the same rule the portfolio uses: a gradient across a block makes line one
     gold and line six white, which is a brightness falloff rather than a style. */

  .ink {
    display: inline-block;
    background-image: var(--type-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }

  .ink-word { display: inline-block; white-space: nowrap; }

  /* ── the chrome ────────────────────────────────────────────── */

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 22px clamp(18px, 4vw, 46px);
    pointer-events: none;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .kicker {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--hum-hot);
    margin-bottom: 6px;
  }

  /* ── the footer ────────────────────────────────────────────── */

  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 18px clamp(18px, 4vw, 46px);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    pointer-events: none;
  }

  #status {
    padding: 7px 14px;
    border: 1px solid rgba(229, 0, 126, 0.5);
    background: rgba(3, 2, 8, 0.86);
    color: #ffd400;
  }

  .note {
    color: rgba(255, 255, 255, 0.42);
  }

  footer a {
    color: #ff2d9b;
    text-decoration: none;
    pointer-events: auto;
  }

  footer a:hover { color: #ffffff; }

  .grow { flex: 1; }

  /* ── reduced motion ────────────────────────────────────────── */

  @media (prefers-reduced-motion: reduce) {
    #vessel { display: none; }
    body::after {
      content: "static render — 19 languages registered, no flow";
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px;
      color: #ffd400;
      font-size: 13px;
      letter-spacing: 0.16em;
    }
  }
</style>
</head>
<body>

<canvas id="vessel"></canvas>

<header>
  <div>
    <div class="kicker">artifact in · proof out</div>
    <h1>Hello World Tree</h1>
  </div>
</header>

<footer>
  <span id="status">loading</span>
  <span class="note">a vessel, not yet filled</span>
  <span class="grow"></span>
  <a href="https://github.com/STATUS-Z/helloworldtree">repository</a>
</footer>

<script type="module" src="/src/main.ts"></script>

<script>
  /* Per-character ink, applied once. The rules are the same as the portfolio's: a gradient across a
     block is a brightness falloff, so every glyph gets its own ramp. */
  (function () {
    const targets = document.querySelectorAll("h1, #status, .note, .kicker, footer a");
    for (const el of targets) {
      const frag = document.createDocumentFragment();
      for (const part of el.textContent.split(/(\s+)/)) {
        if (!part) continue;
        if (/^\s+$/.test(part)) {
          frag.appendChild(document.createTextNode(part));
          continue;
        }
        const word = document.createElement("span");
        word.className = "ink-word";
        for (const ch of Array.from(part)) {
          const s = document.createElement("span");
          s.className = "ink";
          s.textContent = ch;
          word.appendChild(s);
        }
        frag.appendChild(word);
      }
      el.replaceChildren(frag);
    }
  })();
</script>

</body>
</html>
